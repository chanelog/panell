name: Android Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.1.10909125"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v5-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-v5-

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-gomobile-v5-${{ hashFiles('core/go.sum', 'core/go.mod', 'core/tools.go') }}
          restore-keys: ${{ runner.os }}-gomobile-v5-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate gradle wrapper jar
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Resolve Go modules
        working-directory: core
        run: |
          go version
          # tools.go has a blank import of golang.org/x/mobile/bind which
          # makes go mod tidy add (and keep!) x/mobile in the graph.
          # Order matters: tidy first to pick up the import, then `go get`
          # to bump to whatever the proxy currently serves on master.
          go mod tidy
          go get golang.org/x/mobile@latest
          go mod tidy
          go mod download
          echo "--- go.mod ---"
          cat go.mod
          echo "--- modules graph (top 30) ---"
          go list -m all | head -30
          echo "--- assert x/mobile is present ---"
          go list -m golang.org/x/mobile

      - name: Install gomobile / gobind
        working-directory: core
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: |
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | head -1)
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "Using NDK: $ANDROID_NDK_HOME"
          gomobile init

      - name: Build native ZIVPN core (.aar)
        working-directory: core
        run: |
          mkdir -p ../app/libs
          gomobile bind \
            -target=android \
            -androidapi 21 \
            -javapkg=dev \
            -o ../app/libs/zivpn-core.aar \
            ./
          ls -la ../app/libs/

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ZiCustom-debug.apk
          cp app/build/outputs/apk/release/*.apk out/ZiCustom-release-unsigned.apk
          ls -la out/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZiCustom-debug
          path: out/ZiCustom-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZiCustom-release-unsigned
          path: out/ZiCustom-release-unsigned.apk
          if-no-files-found: error

      - name: Upload native AAR
        uses: actions/upload-artifact@v4
        with:
          name: zivpn-core-aar
          path: app/libs/zivpn-core.aar
          if-no-files-found: warn
